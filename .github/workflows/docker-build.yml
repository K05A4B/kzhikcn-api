name: Docker Image CI

on:
  # 改为通过标签触发，原分支触发保留备查
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

  push:
    tags:
      - "v*"

  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Image (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # 精简镜像：:latest / :<version>
          - target: production
            suffix: ""
          # 扩展镜像：:latest-extends / :<version>-extends
          - target: extends
            suffix: "-extends"

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📖 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: ⚙️ Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Get app version
        id: version
        run: |
          VERSION=$(jq -r '.version' internal/appinfo/app_info.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version: $VERSION"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ vars.REGISTRY_USERNAME }}/kzhikcn-api:latest${{ matrix.suffix }}
            ${{ vars.REGISTRY_USERNAME }}/kzhikcn-api:${{ steps.version.outputs.version }}${{ matrix.suffix }}
            ghcr.io/${{ vars.REGISTRY_USERNAME }}/kzhikcn-api:latest${{ matrix.suffix }}
            ghcr.io/${{ vars.REGISTRY_USERNAME }}/kzhikcn-api:${{ steps.version.outputs.version }}${{ matrix.suffix }}
